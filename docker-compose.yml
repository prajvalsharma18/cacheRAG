version: '3.8'

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: smartcache-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--save 60 1
    restart: unless-stopped

volumes:
  redis-data: